plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'uz.arion.ai'
    compileSdk 35

    defaultConfig {
        applicationId 'uz.arion.ai'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.2'
    }

    signingConfigs {
        release {
            def ksPath = System.getenv('ARION_KEYSTORE_PATH')
            if (ksPath == null || ksPath.isEmpty()) {
                throw new GradleException("ARION_KEYSTORE_PATH topilmadi — release APK doimiy imzo bilan yig‘ilishi shart.")
            }
            storeFile file(ksPath)
            storePassword System.getenv('ARION_STORE_PASSWORD')
            keyAlias 'arion-upload'
            keyPassword System.getenv('ARION_KEY_PASSWORD')
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    // Edge Read Aloud SDK: Sec-MS-GEC v2 + WebSocket MP3 stream
    implementation 'io.github.whitemagic2014:tts-edge-java:1.3.4'
}
