plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'uz.arion.ai'
    compileSdk 35

    defaultConfig {
        applicationId 'uz.arion.ai'
        minSdk 26
        targetSdk 35
        versionCode 196
        versionName '1.9.6'
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('ARION_STORE_FILE') ?: 'arion-upload.keystore')
            storePassword System.getenv('ARION_STORE_PASSWORD')
            keyAlias System.getenv('ARION_KEY_ALIAS')
            keyPassword System.getenv('ARION_KEY_PASSWORD')
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
