name: ARION Kotlin Android APK — 3.3 Multi AI Fallback

on:
  workflow_dispatch:
  push:
    paths:
      - 'kotlin_arion/**'
      - '.github/workflows/kotlin-arion.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare persistent signing key
        env:
          ARION_KEYSTORE_BASE64: ${{ secrets.ARION_KEYSTORE_BASE64 }}
        run: |
          test -n "$ARION_KEYSTORE_BASE64" || { echo "Missing ARION_KEYSTORE_BASE64 repository secret"; exit 1; }
          printf '%s' "$ARION_KEYSTORE_BASE64" | base64 --decode > kotlin_arion/app/arion-upload.keystore
          test -s kotlin_arion/app/arion-upload.keystore

      - name: Build signed ARION APK
        working-directory: kotlin_arion
        env:
          ARION_STORE_FILE: arion-upload.keystore
          ARION_STORE_PASSWORD: ${{ secrets.ARION_STORE_PASSWORD }}
          ARION_KEY_PASSWORD: ${{ secrets.ARION_KEY_PASSWORD }}
          ARION_KEY_ALIAS: ${{ secrets.ARION_KEY_ALIAS }}
        run: |
          test -n "$ARION_STORE_PASSWORD"
          test -n "$ARION_KEY_PASSWORD"
          test -n "$ARION_KEY_ALIAS"
          gradle --no-daemon assembleRelease

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ARION-3.3-MULTI-AI-FALLBACK-SIGNED-APK
          path: kotlin_arion/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing key
        if: always()
        run: rm -f kotlin_arion/app/arion-upload.keystore
