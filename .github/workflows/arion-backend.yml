name: ARION 4.0 Backend Checks

on:
  push:
    branches:
      - arion-4.0-autonomous-agent
    paths:
      - 'backend/arion_agent/**'
      - '.github/workflows/arion-backend.yml'
  pull_request:
    paths:
      - 'backend/arion_agent/**'
      - '.github/workflows/arion-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/arion_agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q .
      - name: Run backend tests
        run: python -m unittest -v
