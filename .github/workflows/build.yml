name: ORION APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Kodlarni olish
        uses: actions/checkout@v4

      - name: Kerakli dasturlarni o‘rnatish
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip python3-setuptools python3-venv build-essential autoconf libtool pkg-config zlib1g-dev libncurses5-dev libffi-dev libssl-dev cmake

      - name: Buildozer o‘rnatish
        run: |
          pip3 install --user buildozer Cython==0.29.33
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: ORION APK yig‘ish
        run: |
          buildozer android debug

      - name: APK faylni saqlash
        uses: actions/upload-artifact@v4
        with:
          name: ORION-APK
          path: bin/*.apk
