name: ORION APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout ORION
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ant git zip unzip \
            autoconf automake libtool \
            pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev \
            build-essential

      - name: Find SDK Manager
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: SDKMANAGER NOT FOUND"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android licenses
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager \
            --sdk_root="$ANDROID_HOME" --licenses
          status=${PIPESTATUS[1]}
          set -o pipefail
          exit "$status"

      - name: Install Android packages
        run: |
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Connect Android SDK
        run: |
          mkdir -p "$HOME/.buildozer/android/platform"
          ln -sfn "$ANDROID_HOME" \
            "$HOME/.buildozer/android/platform/android-sdk"

      - name: Fix Legacy SDK Manager
        run: |
          mkdir -p "$ANDROID_HOME/tools/bin"

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | sort -V | tail -n 1)

          ln -sfn "$SDKMANAGER" \
            "$ANDROID_HOME/tools/bin/sdkmanager"

          chmod +x "$ANDROID_HOME/tools/bin/sdkmanager"

          ls -l "$ANDROID_HOME/tools/bin/sdkmanager"
          echo "LEGACY SDKMANAGER READY"

      - name: Configure Apache Ant
        run: |
          ant -version

          ln -sfn /usr/share/ant \
            "$HOME/.buildozer/android/platform/apache-ant-1.9.4"

          echo "ANT READY"

      - name: Check AIDL
        run: |
          test -x "$ANDROID_HOME/build-tools/35.0.0/aidl"
          echo "AIDL READY"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Build ORION APK
        run: |
          buildozer android debug

      - name: Upload ORION APK
        uses: actions/upload-artifact@v4
        with:
          name: ORION-APK
          path: bin/*.apk
          if-no-files-found: error
