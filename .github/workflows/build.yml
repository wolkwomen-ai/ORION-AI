name: ARION Python APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - arion-4.0-autonomous-agent
    paths:
      - 'main.py'
      - 'buildozer.spec'
      - 'assets/**'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout ARION
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip librsvg2-bin autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
          python3 -m pip install --user --upgrade pip setuptools wheel
          python3 -m pip install --user buildozer cython==0.29.36
          echo "$(python3 -m site --user-base)/bin" >> "$GITHUB_PATH"

      - name: Generate ARION launcher icon
        run: |
          mkdir -p assets
          rsvg-convert -w 1024 -h 1024 assets/arion_icon.svg -o assets/arion_icon.png
          test -s assets/arion_icon.png

      - name: Build ARION APK
        env:
          APP_ANDROID_ACCEPT_SDK_LICENSE: "1"
        run: |
          yes | buildozer android debug

      - name: Upload ARION APK
        uses: actions/upload-artifact@v4
        with:
          name: ARION-PYTHON-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
