name: ORION APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Kodlarni olish
        uses: actions/checkout@v4

      - name: Java sozlash
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK sozlash
        uses: android-actions/setup-android@v3

      - name: Android litsenziyalarini qabul qilish
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses
          status=${PIPESTATUS[1]}
          set -o pipefail
          exit "$status"

      - name: Android paketlarini o'rnatish
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          sdkmanager "cmdline-tools;latest"

      - name: AIDL tekshirish
        run: |
          ls "$ANDROID_HOME/build-tools/35.0.0/aidl"
          ls "$ANDROID_HOME/platform-tools"

      - name: Python sozlash
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Buildozer o'rnatish
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython

      - name: ORION APK yaratish
        run: |
          buildozer android debug

      - name: APK faylini saqlash
        uses: actions/upload-artifact@v4
        with:
          name: ORION-APK
          path: bin/*.apk
          if-no-files-found: error
