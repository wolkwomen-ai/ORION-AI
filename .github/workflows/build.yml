name: ARION Kotlin APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'kotlin_arion/**'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout ARION
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Kotlin Android APK
        working-directory: kotlin_arion
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload ARION APK
        uses: actions/upload-artifact@v4
        with:
          name: ARION-KOTLIN-APK
          path: kotlin_arion/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
