name: ARION Python APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'main.py'
      - 'buildozer.spec'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout ARION
        uses: actions/checkout@v4

      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip             autoconf libtool pkg-config zlib1g-dev libncurses5-dev             libncursesw5-dev cmake libffi-dev libssl-dev
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install buildozer cython==0.29.36

      - name: Build ARION APK
        env:
          APP_ANDROID_ACCEPT_SDK_LICENSE: "1"
        run: |
          yes | buildozer android debug

      - name: Upload ARION APK
        uses: actions/upload-artifact@v4
        with:
          name: ARION-PYTHON-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
